name: Deploy documentation

on:
  push:
    branches:
      - main
    paths-ignore:
      - "00_Brainstorming/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs Material
        run: pip install -r requirements.txt

      - name: Prepare published documents
        run: python .mkdocs/prepare.py

      - name: Build site
        run: mkdocs build --strict --config-file .mkdocs/mkdocs.yml

      - name: Verify build output
        run: ls -la .mkdocs/site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .mkdocs/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
